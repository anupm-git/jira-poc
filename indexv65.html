<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Jira Command Center</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --border: #E4E7EC;
    --border-soft: #ECEEF2;
    --bg: #F4F5F8;
    --card: #FFFFFF;
    --text: #16181D;
    --text-soft: #3C4451;
    --muted: #6B7280;
    --accent: #4F46E5;
    --accent-dark: #4338CA;
    --accent-soft: #EEF0FF;
    --accent-ring: rgba(79,70,229,0.22);
    --success: #17945A;
    --success-soft: #E6F6EE;
    --warning: #B8850F;
    --danger: #C0392B;
    --danger-soft: #FBEAEA;
    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 14px;
    --shadow-1: 0 1px 2px rgba(16,24,40,0.05);
    --shadow-2: 0 4px 12px rgba(16,24,40,0.08);
    --shadow-3: 0 10px 30px rgba(16,24,40,0.14);
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--font-ui); -webkit-font-smoothing: antialiased; }
  #root { height: 100%; }
  .app-root { display: flex; flex-direction: column; height: 100%; }
  ::selection { background: var(--accent-ring); }
  *:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---- Fluid sizing tokens: scale continuously with viewport width so a 14"
     laptop (~1366-1536px) and a 24"+ monitor (~1920-2560px) each get a toolbar
     sized for them, instead of jumping between fixed breakpoints. ---- */
  :root {
    --tb-font: clamp(10.5px, 0.62vw + 6px, 12.5px);
    --tb-pad-y: clamp(3px, 0.16vw + 1px, 6px);
    --tb-pad-x: clamp(6px, 0.35vw + 2px, 10px);
    --tb-gap: clamp(3px, 0.25vw, 6px);
    --tb-group-gap: clamp(4px, 0.4vw, 10px);
    --tb-icon: clamp(11px, 0.7vw + 6px, 14px);
  }

  .topbar {
    display: flex; flex-direction: column; align-items: stretch;
    padding: 0 clamp(10px, 1.2vw, 22px);
    background: linear-gradient(180deg, #FFFFFF 0%, #FCFCFE 100%);
    border-bottom: 1px solid var(--border); box-shadow: var(--shadow-1);
    position: relative; z-index: 20;
  }
  .brand-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 11px 0 9px; }
  .brand-mark {
    width: 30px; height: 30px; border-radius: 9px; flex-shrink: 0;
    background: linear-gradient(135deg, var(--accent) 0%, #7C74F0 100%);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 800; font-size: 14px; box-shadow: var(--shadow-2);
  }
  .brand-title { font-size: clamp(14.5px, 0.9vw + 8px, 18px); font-weight: 800; color: var(--text); white-space: nowrap; letter-spacing: -0.01em; }
  .brand-sub { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .brand-status {
    margin-left: auto; display: flex; align-items: center; gap: 8px;
    font-size: 11px; color: var(--muted); white-space: nowrap;
  }
  .brand-status .dot-live { width: 7px; height: 7px; border-radius: 50%; background: var(--success); box-shadow: 0 0 0 3px var(--success-soft); }
  .flow-badge {
    font-family: inherit; font-size: 11.5px; font-weight: 700; color: var(--accent-dark);
    background: var(--accent-soft); border: 1px solid #C9C6F7; border-radius: 999px;
    padding: 5px 12px; cursor: pointer; white-space: nowrap; margin-left: 4px;
  }
  .flow-badge:hover { background: #E3E1FC; }

  /* ---- Metrics page: full-screen, its own left nav, separate from the
     flowchart canvas and from modals (no backdrop, no click-outside close). ---- */
  .metrics-page {
    position: fixed; inset: 0; z-index: 40;
    display: flex; flex-direction: column;
    background: var(--bg); font-family: var(--font-ui);
  }
  .metrics-topbar {
    display: flex; align-items: center; gap: 12px;
    padding: 10px clamp(12px, 1.4vw, 22px);
    background: linear-gradient(180deg, #FFFFFF 0%, #FCFCFE 100%);
    border-bottom: 1px solid var(--border); box-shadow: var(--shadow-1);
    flex-shrink: 0;
  }
  .metrics-back-btn {
    font-family: inherit; font-size: 12.5px; font-weight: 650; color: var(--text-soft);
    background: #fff; border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 6px 12px; cursor: pointer; display: flex; align-items: center; gap: 6px;
  }
  .metrics-back-btn:hover { background: var(--accent-soft); border-color: #C9C6F7; color: var(--accent-dark); }
  .metrics-topbar .brand-mark { width: 28px; height: 28px; font-size: 12.5px; }
  .metrics-topbar-title { font-size: 15.5px; font-weight: 800; color: var(--text); letter-spacing: -0.01em; }
  .metrics-topbar-sub { font-size: 11.5px; color: var(--muted); }

  .metrics-body { flex: 1; display: flex; min-height: 0; }

  .metrics-sidebar {
    width: 210px; flex-shrink: 0; overflow-y: auto;
    background: #fff; border-right: 1px solid var(--border);
    padding: 10px 8px;
  }
  .metrics-nav-item {
    width: 100%; display: flex; align-items: center; gap: 9px;
    font-family: inherit; font-size: 12.8px; font-weight: 600; color: var(--text-soft);
    background: transparent; border: none; border-radius: var(--radius-sm);
    padding: 8px 10px; margin-bottom: 2px; cursor: pointer; text-align: left;
  }
  .metrics-nav-item:hover { background: var(--bg); color: var(--text); }
  .metrics-nav-item.active { background: var(--accent-soft); color: var(--accent-dark); }
  .metrics-nav-item .nav-icon { font-size: 14.5px; width: 18px; text-align: center; flex-shrink: 0; }
  .metrics-nav-item .nav-label { flex: 1; }
  .metrics-nav-item .nav-badge {
    font-size: 9px; font-weight: 800; color: var(--accent);
    background: var(--accent-soft); border-radius: 999px; padding: 1px 6px;
    letter-spacing: 0.03em; flex-shrink: 0;
  }
  /* Child rows nested under a parent section (e.g. Burndown/Burnup/Team
     Progress under Gantt) — indented, slightly smaller, thinner weight. */
  .metrics-nav-item.child { padding-left: 30px; font-size: 12px; font-weight: 500; margin-bottom: 1px; }
  .metrics-nav-item.child .nav-icon { font-size: 12.5px; width: 15px; }
  .metrics-nav-item.child.grand { padding-left: 46px; }

  .metrics-content { flex: 1; overflow-y: auto; padding: clamp(14px, 1.6vw, 26px); }
  .metrics-content-header { margin-bottom: 14px; }
  .metrics-content-title { font-size: 17px; font-weight: 800; color: var(--text); letter-spacing: -0.01em; }
  .metrics-content-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .metrics-empty {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 8px; padding: 60px 20px; color: var(--muted);
    background: #fff; border: 1px dashed var(--border); border-radius: var(--radius-lg);
    text-align: center;
  }
  .metrics-empty .metrics-empty-icon { font-size: 30px; }
  .metrics-empty .metrics-empty-title { font-size: 13.5px; font-weight: 700; color: var(--text-soft); }
  .metrics-empty .metrics-empty-sub { font-size: 12px; max-width: 340px; }

  /* ---- Ribbon: tab strip + active tab's group panel ---- */
  .ribbon-tabs { display: flex; align-items: flex-end; gap: 2px; flex-wrap: wrap; }
  .ribbon-tab {
    font-family: inherit; font-size: 12.5px; font-weight: 650; color: var(--muted);
    background: transparent; border: none; border-bottom: 2px solid transparent;
    padding: 8px 14px; cursor: pointer; border-radius: 8px 8px 0 0; transition: all 0.14s ease;
  }
  .ribbon-tab:hover { color: var(--text); background: var(--accent-soft); }
  .ribbon-tab.active { color: var(--accent); border-bottom-color: var(--accent); background: var(--accent-soft); }
  .ribbon-panel {
    display: flex; flex-direction: row; flex-wrap: wrap; align-items: center;
    gap: var(--tb-gap) var(--tb-group-gap);
    background: #FAFAFC; border: 1px solid var(--border-soft); border-top: none;
    border-radius: 0 0 10px 10px; padding: 8px 10px; margin-bottom: 10px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.6);
  }
  .toolbar-row { display: contents; }
  .ribbon-subtabs { flex: 0 0 100%; display: flex; align-items: center; gap: 4px; flex-wrap: wrap; padding-bottom: 6px; border-bottom: 1px dashed var(--border); }
  .ribbon-subtabs-label { font-size: 10.5px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em; padding-right: 4px; }
  .ribbon-subtab {
    font-family: inherit; font-size: 12px; font-weight: 650; color: var(--muted);
    background: transparent; border: 1px solid transparent; box-shadow: none;
    padding: 4px 12px; border-radius: 999px; cursor: pointer; transition: all 0.14s ease;
  }
  .voice-select { font-family: inherit; font-size: 12px; max-width: 200px; padding: 3px 6px; border: 1px solid var(--border); border-radius: 6px; background: #fff; color: var(--text); }
  .ribbon-subtab:hover { color: var(--text); background: var(--accent-soft); }
  .ribbon-subtab.active { color: var(--accent-dark); background: var(--accent-soft); border-color: #C9C6F7; }
  .tool-group {
    display: flex; align-items: center; gap: 4px; background: #FFFFFF; border: 1px solid var(--border);
    border-radius: var(--radius-md); padding: 3px var(--tb-pad-x); flex-wrap: nowrap; white-space: nowrap;
    box-shadow: var(--shadow-1);
  }
  .tool-label { font-size: 10.5px; font-weight: 600; color: var(--muted); padding: 0 4px; white-space: nowrap; text-transform: uppercase; letter-spacing: 0.03em; }
  button {
    font-family: inherit; font-size: var(--tb-font); line-height: 1.2; color: var(--text-soft); background: #FFFFFF;
    border: 1px solid var(--border); border-radius: var(--radius-sm); padding: var(--tb-pad-y) var(--tb-pad-x); cursor: pointer;
    white-space: nowrap; transition: background 0.12s ease, border-color 0.12s ease, box-shadow 0.12s ease, transform 0.06s ease;
  }
  button:hover:not(:disabled) { background: var(--accent-soft); border-color: #C9C6F7; color: var(--accent-dark); }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button.active { background: var(--accent); color: #fff; border-color: var(--accent); box-shadow: 0 2px 6px var(--accent-ring); }
  .zoom-readout { font-size: var(--tb-font); color: var(--muted); min-width: 34px; text-align: center; font-weight: 600; }

  .mode-toggle { font-weight: 700; }
  .mode-toggle.view { background: #F0F1F3; border-color: #9AA1AC; color: #3C4451; }
  .mode-toggle.edit { background: var(--success); border-color: var(--success); color: #fff; }

  .help-strip {
    background: linear-gradient(90deg, #FFF9EC, #FFFDF7); border-bottom: 1px solid #F0DDA6; color: #7A5A0A;
    font-size: 12.5px; padding: 8px 22px; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .help-strip .dismiss { background: transparent; border: none; color: #7A5A0A; font-size: 14px; cursor: pointer; padding: 2px 6px; border-radius: 6px; }
  .help-strip .dismiss:hover { background: rgba(122,90,10,0.1); }

  .stage { flex: 1; display: flex; min-height: 0; }
  .viewport {
    flex: 1; position: relative; overflow: hidden; background:
      linear-gradient(90deg, rgba(0,0,0,0.035) 1px, transparent 1px) 0 0 / 24px 24px,
      linear-gradient(rgba(0,0,0,0.035) 1px, transparent 1px) 0 0 / 24px 24px, var(--bg);
    cursor: grab;
  }
  .viewport:active { cursor: grabbing; }
  .inner { position: absolute; top: 0; left: 0; transform-origin: 0 0; }

  .edit-overlay {
    position: absolute; z-index: 5; resize: none; font-family: Arial, sans-serif;
    font-size: 13px; font-weight: 600; text-align: center; padding: 4px; border-radius: 8px;
    border: 2px solid var(--accent); outline: none; background: #FFFFFF; color: var(--text);
  }

  .panel-card { border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 14px; margin-bottom: 14px; background: linear-gradient(180deg, #FFFFFF, #FCFCFE); box-shadow: var(--shadow-1); }
  .panel-card.muted { color: var(--muted); font-size: 13px; }
  .panel-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); margin-bottom: 8px; }
  .panel-step-text { font-size: 14.5px; font-weight: 700; margin-bottom: 8px; }
  .panel-row { margin-bottom: 10px; }
  .status-chip { display: inline-block; color: #fff; font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px; }
  .panel-btn {
    display: block; width: 100%; text-align: left; margin-bottom: 6px; padding: 8px 10px;
    background: #fff; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 13px;
    transition: background 0.12s ease, transform 0.06s ease;
  }
  .panel-btn:hover { background: var(--accent-soft); border-color: #C9C6F7; }
  .panel-btn:active { transform: translateY(1px); }
  .panel-btn.danger { color: var(--danger); }
  .panel-btn.danger:hover { background: var(--danger-soft); border-color: #E9B9B9; }
  .panel-meta { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border); font-size: 12.5px; color: #3C4451; line-height: 1.6; }
  .panel-label { display: block; font-size: 11.5px; color: var(--muted); margin-bottom: 4px; }
  .panel-input {
    width: 100%; padding: 7px 8px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; font-family: inherit;
  }

  .legend-row { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: #3C4451; margin-bottom: 7px; }
  .swatch { width: 16px; height: 16px; border: 2px solid; border-radius: 4px; flex-shrink: 0; }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; margin-left: 3px; margin-right: 3px; }

  /* N/S/E/W connection anchors: small dot only shows on hover, but the actual
     grabbable hit-zone (.anchor-hit) is a larger invisible circle so it's easy
     to grab precisely even at low zoom levels. */
  .node-group .anchor-dot { opacity: 0; transition: opacity 0.12s ease; }
  .node-group:hover .anchor-dot { opacity: 1; }
  .node-group .anchor-hit { fill: transparent; cursor: crosshair; }
  .node-group .anchor-hit:hover + .anchor-dot { opacity: 1; fill: #1868DB; r: 6.5; }
  /* While dragging a new connector, the single nearest anchor on the hovered
     target node is highlighted in green so it's unambiguous which N/S/E/W
     point will be used when the mouse is released. */
  .anchor-dot.candidate { opacity: 1 !important; fill: #1E9E5A !important; stroke: #0E4227 !important; r: 7.5 !important; }

  /* Color palette swatches (side panel) */
  .palette-row { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 6px; }
  .palette-swatch {
    width: 22px; height: 22px; border-radius: 6px; border: 2px solid rgba(0,0,0,0.12); cursor: pointer;
    padding: 0; flex-shrink: 0;
  }
  .palette-swatch.selected { border-color: #1868DB; box-shadow: 0 0 0 2px rgba(24,104,219,0.25); }
  .palette-swatch.reset { background: #fff; display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--muted); }

  /* Floating, non-blocking bar shown while multiple steps are selected.
     Unlike the old modal, this never covers the canvas or stops the user
     from continuing to drag/pan/click through to the rest of the app. */
  .selection-bar {
    position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%);
    z-index: 6; display: flex; align-items: center; gap: 9px; flex-wrap: wrap;
    background: var(--card); border: 1px solid var(--border); border-radius: 999px;
    padding: 6px 8px 6px 14px; box-shadow: 0 6px 20px rgba(0,0,0,0.16);
    max-width: calc(100% - 40px);
  }
  .selection-bar .selection-count { font-size: 12.5px; font-weight: 700; color: var(--text); white-space: nowrap; }
  .selection-bar .selection-hint { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .selection-bar button { padding: 5px 9px; font-size: 12px; }
  .selection-bar button.danger { color: #B23A3A; border-color: #E9B9B9; }
  .selection-bar button.danger:hover { background: #FBEAEA; }
  .selection-bar .palette-row { margin: 0; gap: 5px; }
  .selection-bar .palette-swatch { width: 18px; height: 18px; }
  .selection-bar .selection-close {
    background: transparent; border: none; color: var(--muted); font-size: 15px; cursor: pointer;
    padding: 2px 6px; border-radius: 999px; line-height: 1;
  }
  .selection-bar .selection-close:hover { background: #EEF2F8; color: var(--text); }

  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(20, 24, 32, 0.45); display: flex;
    align-items: center; justify-content: center; z-index: 50;
  }
  .modal {
    width: 380px; max-width: 92vw; background: #fff; border-radius: 12px; padding: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25); max-height: 88vh; overflow-y: auto;
  }
  .modal-title { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
  .modal-step { font-size: 12.5px; color: var(--muted); margin-bottom: 14px; }
  .modal label { display: block; font-size: 12px; font-weight: 600; color: #3C4451; margin: 10px 0 4px; }
  .modal input, .modal select, .modal textarea {
    width: 100%; padding: 8px 9px; border: 1px solid var(--border); border-radius: 7px;
    font-family: inherit; font-size: 13px; resize: vertical;
  }
  .modal-actions { display: flex; justify-content: flex-end; margin-top: 16px; }
  .modal-actions .panel-btn { width: auto; padding: 8px 18px; background: var(--accent); color: #fff; border-color: var(--accent); }

  .modal-wide { width: 920px; max-width: 96vw; }
  .jira-grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0 10px; }
  .jira-tabs {
    display: flex; gap: 3px; margin: 4px 0 16px; background: var(--accent-soft);
    border-radius: var(--radius-md); padding: 4px; width: fit-content;
  }
  .jira-tabs button {
    font-size: 12.5px; font-weight: 600; padding: 7px 14px; border: none; border-radius: var(--radius-sm);
    background: transparent; color: var(--text-soft); box-shadow: none;
  }
  .jira-tabs button:hover:not(:disabled):not(.active) { background: rgba(79,70,229,0.1); color: var(--accent-dark); }
  .jira-tabs button.active { background: #fff; color: var(--accent-dark); box-shadow: var(--shadow-1); }
  .jira-tabs button:disabled { opacity: 0.4; }
  .jira-status-line { font-size: 12px; padding: 8px 10px; border-radius: 7px; margin: 10px 0; }
  .jira-status-line.err { background: #FBEAEA; color: #7A2020; border: 1px solid #E3B3B3; }
  .jira-status-line.ok { background: #E7F7EE; color: #0E4227; border: 1px solid #A9DBC0; }
  .jira-status-line.info { background: #EAF1FB; color: #173561; border: 1px solid #C7D2E0; }
  .jira-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .jira-table th, .jira-table td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); }
  .jira-table th { color: var(--muted); font-weight: 600; }

  /* ---- Reports landing page + KPI cards, shared by the new metric sub-tabs ---- */
  .report-hub-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
  .report-hub-card {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-lg);
    padding: 16px; text-align: left; cursor: pointer; box-shadow: var(--shadow-1);
    transition: box-shadow .15s ease, transform .15s ease, border-color .15s ease;
    display: flex; flex-direction: column; gap: 6px;
  }
  .report-hub-card:hover { box-shadow: var(--shadow-2); transform: translateY(-1px); border-color: #C9C6F7; }
  .report-hub-card .rh-icon { font-size: 20px; }
  .report-hub-card .rh-title { font-size: 13px; font-weight: 700; color: var(--text); }
  .report-hub-card .rh-desc { font-size: 11.5px; color: var(--muted); line-height: 1.4; flex: 1; }
  .report-hub-card .rh-stat { font-size: 20px; font-weight: 800; color: var(--accent-dark); }
  .report-hub-card .rh-stat-label { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }

  .kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .kpi-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 12px 14px; box-shadow: var(--shadow-1); }
  .kpi-card .kpi-label { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; font-weight: 600; }
  .kpi-card .kpi-value { font-size: 22px; font-weight: 800; color: var(--text); margin-top: 3px; }
  .kpi-card .kpi-value.accent { color: var(--accent-dark); }
  .kpi-card .kpi-value.good { color: var(--success); }
  .kpi-card .kpi-value.warn { color: var(--warning); }
  .kpi-card .kpi-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }

  /* ---- Overview tab: one capacity tile per sub-track ---- */
  .subtrack-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
  .subtrack-tile { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-1); padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
  .subtrack-tile-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }

  .subtrack-progress-fill { height: 100%; background: var(--accent); border-radius: 999px; }

  .vel-sub-tile { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 12px 14px; box-shadow: var(--shadow-1); min-width: 0; }

    box-shadow: var(--shadow-1); padding: 16px 18px; display: flex; flex-direction: column; gap: 10px;

  /* ---- Gantt (Data tab > Metrics > Gantt) — OKR-roadmap-style tree table ----
     Layout: a fixed-width frozen left pane (tree + optional columns, its own
     vertical scrollbar) sits beside a flexible right pane (a day/month date
     ruler stuck to the top + a horizontally-panning bar timeline). The two
     panes' vertical scroll positions are kept in sync in JS; row/header
     heights are shared constants so rows always line up between panes. */
  .gantt-box { background: #fff; padding: 0; overflow: hidden; }
  .gantt-toolbar { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; border-bottom: 1px solid var(--border); background: #F8F9FB; position: relative; }
  .gantt-toolbar-left { display: flex; align-items: center; gap: 6px; }
  .gantt-toolbar-hint { font-size: 11px; color: var(--muted); margin-left: 4px; }
  .gantt-toolbar-right { position: relative; display: flex; align-items: center; }
  .gantt-subtrack-bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
  .gantt-tool-btn {
    font-family: inherit; font-size: 11.5px; font-weight: 650; color: var(--text-soft);
    background: #fff; border: 1px solid var(--border); border-radius: 6px; padding: 5px 10px; box-shadow: none;
  }
  .gantt-tool-btn:hover { background: var(--accent-soft); border-color: #C9C6F7; color: var(--accent-dark); }
  .gantt-columns-pop {
    position: absolute; right: 0; top: calc(100% + 6px); z-index: 20; width: 190px;
    background: #fff; border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow-2, 0 8px 24px rgba(20,22,30,0.14));
    padding: 8px; max-height: 260px; overflow-y: auto;
  }

  /* ---- Demo Mode: "accelerator" path playback ----
     - .demo-pulse-current: strong glowing/pulsing ring around the active step
     - .demo-blip-next: softer pulsing ring "blipping" on the upcoming step
     - .demo-done-badge: small check badge that pops in on a completed step
     - .demo-transit-path: the animated dashed edge currently being traversed
     - .demo-runner-dot / .demo-runner-glow: the comet-style dot that travels
       along the transit edge via <animateMotion>, giving the GIF-like feel */
  @keyframes demoPulseCurrent {
    0% { stroke-opacity: 1; stroke-width: 4; filter: drop-shadow(0 0 0 rgba(224,134,47,0.5)); }
    50% { stroke-opacity: 0.55; stroke-width: 5.5; filter: drop-shadow(0 0 8px rgba(224,134,47,0.85)); }
    100% { stroke-opacity: 1; stroke-width: 4; filter: drop-shadow(0 0 0 rgba(224,134,47,0.5)); }
  }
  .demo-pulse-current { animation: demoPulseCurrent 1s ease-in-out infinite; transform-origin: center; }

  @keyframes demoBlipNext {
    0% { stroke-opacity: 0.35; transform: scale(1); }
    50% { stroke-opacity: 0.9; transform: scale(1.035); }
    100% { stroke-opacity: 0.35; transform: scale(1); }
  }
  .demo-blip-next { animation: demoBlipNext 1.3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }

  @keyframes demoBadgePop {
    0% { transform: scale(0); opacity: 0; }
    60% { transform: scale(1.2); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }
  .demo-done-badge { animation: demoBadgePop 0.35s cubic-bezier(.34,1.56,.64,1) both; transform-box: fill-box; transform-origin: center; }

  @keyframes demoDashFlow { to { stroke-dashoffset: -32; } }
  .demo-transit-path { animation: demoDashFlow 0.7s linear infinite; }

  .demo-runner-dot { filter: drop-shadow(0 0 5px rgba(255,176,32,0.95)) drop-shadow(0 0 10px rgba(224,134,47,0.6)); }
  .demo-runner-glow { filter: blur(1.5px); }

  .ribbon-tab.demo-tab.active, .ribbon-tab.demo-tab:hover { color: var(--warning); background: #FFF6E8; border-bottom-color: var(--warning); }

  .demo-progress-track { flex: 1; height: 6px; border-radius: 999px; background: var(--border-soft); overflow: hidden; min-width: 100px; }

  .tab-refresh-bar { display:flex; justify-content:flex-end; align-items:center; gap:8px; margin:0 0 8px; }

  .tab-refresh-btn:hover:not(:disabled) { background:var(--accent-soft,#eef); color:var(--accent,#4f46e5); }
  .tab-refresh-btn:disabled { opacity:.6; cursor:default; }
  .wf-toolbar { position:sticky; left:0; top:0; z-index:5; display:flex; gap:8px; align-items:center; justify-content:flex-end; margin:0 auto 10px; max-width:1280px; }
  .wf-toolbar button { background:#16204a; color:#DDE4FF; border:1px solid #2c3a78; border-radius:6px; padding:4px 11px; font-size:13px; font-weight:600; cursor:pointer; }

  .wf-toolbar button:disabled { opacity:.6; cursor:default; }

  .wf-stage { overflow: auto; background: #070C22; padding: 14px; }
  .wf-wrap { max-width: 1280px; margin: 0 auto; }
  .wf-svg { width: 100%; height: auto; display: block; background: #0A1030; border-radius: 10px; }
  .wf-title { fill: #fff; font: 800 24px var(--font-ui); letter-spacing: .01em; }
  .wf-legend { fill: #DDE4FF; font: 500 10.5px var(--font-ui); }
  .wf-band { fill: #0C1438; stroke: #263A8A; stroke-width: 1.2; }
  .wf-band-t { fill: #C7D2FF; font: 700 9.5px var(--font-ui); letter-spacing: .05em; }
  .wf-edge { fill: none; stroke: #DDE4FF; stroke-width: 1.3; }
  .wf-lbl { fill: #DDE4FF; font: 600 8.5px var(--font-ui); } .wf-lbl.it { font-style: italic; font-weight: 400; }
  .wf-start { fill: #fff; font: 700 8px var(--font-ui); }
  .wf-node { cursor: pointer; } .wf-node:hover rect, .wf-node:focus rect, .wf-node:hover polygon, .wf-node:focus polygon { filter: brightness(1.25); stroke: #fff; stroke-width: 2; } .wf-node:focus { outline: none; }
  .wf-node-t { fill: #fff; font: 700 11.5px var(--font-ui); pointer-events: none; } .wf-node-s { fill: #D6E2FF; font: 600 8.5px var(--font-ui); pointer-events: none; }
  .wf-badge { fill: #fff; stroke: #0A1030; stroke-width: 1.5; } .wf-badge-t { fill: #0A1030; font: 800 9px var(--font-ui); pointer-events: none; }
  .wf-hint { color: #A9B6E6; font-size: 11.5px; margin-top: 8px; text-align: center; }
  .wf-modal { width: min(620px, 94vw); } .wf-dot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 7px; }
  .wf-row { cursor: pointer; } .wf-row:hover { background: var(--accent-soft); }
  .wf-issues { background: #FAFAFC; font-size: 11.5px; line-height: 1.6; max-height: 180px; overflow: auto; }
  .jira-fetch-btn { display: block; width: 100%; margin-top: 12px; padding: 15px 18px; font-family: inherit; font-size: 16px; font-weight: 800; letter-spacing: .02em; color: #fff; border: 0; border-radius: 10px; cursor: pointer; background: linear-gradient(135deg, #4F46E5 0%, #7C74F0 100%); box-shadow: 0 4px 14px rgba(79,70,229,.35); }
  .jira-fetch-btn:hover:not(:disabled) { filter: brightness(1.08); box-shadow: 0 6px 18px rgba(79,70,229,.45); }
  .jira-fetch-btn:disabled { opacity: .65; cursor: wait; }
  .pg-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(600px, 1fr)); gap: 14px; margin-bottom: 18px; }
  .pg-card { background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
  .pg-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .pg-name { font-weight: 700; font-size: 13.5px; } .pg-total { font-size: 11.5px; color: var(--muted); } .pg-total b { font-size: 16px; color: var(--ink, #222); }
  .pg-epic-chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  .pg-chip { border: 1px solid var(--border); border-radius: 999px; padding: 4px 11px; font: 600 11.5px var(--font-ui); background: #fff; cursor: pointer; }
  .pg-chip.warn { background: #FFF6E5; border-color: #F0C36D; } .pg-chip.ok { background: #E9F8EF; border-color: #7CCB9B; } .pg-chip.bad { background: #FDE6E6; border-color: #E8A09B; } .pg-chip.info { background: #EAF1FE; border-color: #9DBBF0; } .pg-chip:disabled { opacity: .55; cursor: default; }
  .pg-chip:not(:disabled):hover { filter: brightness(.95); }
  .pg-table { width: 100%; border-collapse: collapse; font-size: 11px; }
  .pg-table th { font-weight: 600; color: var(--muted); text-align: center; padding: 4px 3px; border-bottom: 1px solid var(--border); line-height: 1.2; }
  .pg-table th:first-child, .pg-table td.pg-type { text-align: left; }
  .pg-table td { text-align: center; padding: 5px 3px; border-bottom: 1px solid #F0F1F4; }
  .pg-type { font-weight: 600; white-space: nowrap; }
  .pg-cell { border: 0; background: var(--accent-soft); color: var(--accent-dark); font: 700 12px var(--font-ui); min-width: 28px; padding: 2px 7px; border-radius: 6px; cursor: pointer; }
  .pg-cell:hover { background: var(--accent); color: #fff; } .pg-zero { color: #B5BAC6; }
  @media(max-width:700px){ .pg-grid { grid-template-columns: 1fr; } }
  .sh-program { background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 18px 22px; margin-bottom: 18px; box-shadow: 0 2px 10px rgba(30,40,90,.06); }
  .sh-program-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .sh-program-title { font-size: 20px; font-weight: 800; } .sh-program-sub { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .sh-program-badge { font-size: 16px !important; padding: 8px 18px !important; }
  .sh-program-body { display: flex; align-items: center; justify-content: space-around; flex-wrap: wrap; gap: 18px; }
  .sh-days-big, .sh-scope-big { display: flex; flex-direction: column; align-items: center; min-width: 140px; }
  .sh-days-big b, .sh-scope-big b { font-size: 54px; font-weight: 800; line-height: 1.05; color: var(--accent-dark); } .sh-scope-big b { font-size: 44px; }
  .sh-days-big span, .sh-scope-big span { font-size: 12px; color: var(--muted); text-align: center; }
  .sh-ring { display: flex; flex-direction: column; align-items: center; } .sh-ring-label { font-weight: 700; font-size: 13.5px; margin-top: 2px; } .sh-ring-sub { font-size: 11.5px; color: var(--muted); }

/* =====================================================================
   ✦ UI OVERHAUL — "Aurora" theme layer
   Re-skins every page by redefining design tokens, then refining the
   major components. All JS / logic is untouched.
   ===================================================================== */
:root {
  --bg: #F2F1FA;
  --card: #FFFFFF;
  --border: #E1DFF2;
  --border-soft: #EBE9F7;
  --text: #17153A;
  --text-soft: #3E3B66;
  --muted: #7A77A3;

  --accent: #6D5DF6;
  --accent-dark: #4B3BD6;
  --accent-soft: #EFEDFF;
  --accent-ring: rgba(109,93,246,.28);
  --accent-2: #EC4899;
  --accent-3: #14B8A6;
  --accent-4: #F59E0B;
  --accent-5: #0EA5E9;

  --success: #12A150;
  --success-soft: #DDF6E8;
  --warning: #C77700;
  --danger: #DC3A4A;
  --danger-soft: #FDE7EA;

  --navy-1: #14123A;
  --navy-2: #221C6B;
  --navy-3: #3A2A9A;
  --grad-brand: linear-gradient(135deg, #6D5DF6 0%, #A855F7 55%, #EC4899 100%);
  --grad-accent: linear-gradient(135deg, #6D5DF6 0%, #8B5CF6 100%);
  --grad-hero: linear-gradient(120deg, #14123A 0%, #2B2090 55%, #5B2BB5 100%);

  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 18px;
  --shadow-1: 0 1px 2px rgba(34,28,107,.06), 0 1px 3px rgba(34,28,107,.05);
  --shadow-2: 0 6px 18px rgba(34,28,107,.10);
  --shadow-3: 0 18px 44px rgba(34,28,107,.20);
  --font-ui: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --ease: cubic-bezier(.2,.8,.2,1);
}

html, body {
  background:
    radial-gradient(1100px 600px at 100% -10%, rgba(168,85,247,.10), transparent 60%),
    radial-gradient(900px 500px at -10% 110%, rgba(14,165,233,.09), transparent 60%),
    var(--bg);
  background-attachment: fixed;
  letter-spacing: -0.003em;
}
::selection { background: rgba(109,93,246,.28); }
*:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

/* ---- Slim modern scrollbars ---- */
* { scrollbar-width: thin; scrollbar-color: #C4C0EA transparent; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: #CBC7EE; border-radius: 999px; border: 2px solid transparent; background-clip: content-box; }
::-webkit-scrollbar-thumb:hover { background: #A9A2E6; background-clip: content-box; border: 2px solid transparent; }
::-webkit-scrollbar-track { background: transparent; }

/* ---- Buttons ---- */
button {
  border-radius: var(--radius-sm); border-color: var(--border); color: var(--text-soft); font-weight: 550;
  background: linear-gradient(180deg, #fff, #FAF9FF);
  transition: background .16s var(--ease), border-color .16s var(--ease), box-shadow .16s var(--ease), transform .12s var(--ease), color .16s var(--ease);
}
button:hover:not(:disabled) { background: var(--accent-soft); border-color: #BDB5F7; color: var(--accent-dark); box-shadow: 0 2px 8px rgba(109,93,246,.14); transform: translateY(-1px); }
button:active:not(:disabled) { transform: translateY(0); box-shadow: none; }
button.active { background: var(--grad-accent); border-color: transparent; color: #fff; box-shadow: 0 4px 12px rgba(109,93,246,.38); }
button.active:hover:not(:disabled) { background: var(--grad-accent); color: #fff; filter: brightness(1.07); }
.mode-toggle.view { background: #F1F0FB; border-color: #B8B4DA; color: var(--text-soft); }
.mode-toggle.edit { background: linear-gradient(135deg, #12A150, #0E8A8A); border-color: transparent; color: #fff; box-shadow: 0 4px 12px rgba(18,161,80,.35); }

/* ---- Form controls ---- */
input[type="text"], input[type="search"], input[type="number"], input[type="date"], input[type="password"], input[type="url"], input:not([type]), select, textarea,
.panel-input, .raci-input, .scope-search, .burn-sprint-select, .voice-select, .strategic-sprint-row input {
  border: 1px solid var(--border); border-radius: var(--radius-sm); background: #fff; color: var(--text);
  transition: border-color .16s var(--ease), box-shadow .16s var(--ease);
}
input:hover, select:hover, textarea:hover { border-color: #BDB5F7; }
input:focus, select:focus, textarea:focus, .scope-search:focus { outline: none !important; border-color: var(--accent) !important; box-shadow: 0 0 0 3px var(--accent-ring) !important; }
input[type="checkbox"], input[type="radio"] { accent-color: var(--accent); }

/* =====================================================================
   TOP BAR  (deep gradient hero + light ribbon panel)
   ===================================================================== */
.topbar {
  background: var(--grad-hero);
  border-bottom: none; padding-bottom: 0;
  box-shadow: 0 8px 28px rgba(34,28,107,.28);
  position: relative; overflow: visible;
}
.topbar::before {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background:
    radial-gradient(520px 220px at 12% 0%, rgba(236,72,153,.28), transparent 70%),
    radial-gradient(520px 260px at 92% 10%, rgba(14,165,233,.25), transparent 70%);
}
.topbar > * { position: relative; }
.brand-row { padding: 14px 0 10px; gap: 14px; }
.brand-mark {
  width: 38px; height: 38px; border-radius: 12px; font-size: 17px; font-weight: 800;
  background: var(--grad-brand); box-shadow: 0 6px 18px rgba(236,72,153,.45), inset 0 1px 0 rgba(255,255,255,.4);
}
.brand-title { color: #fff; font-weight: 800; letter-spacing: -.02em; text-shadow: 0 1px 12px rgba(0,0,0,.25); }
.brand-sub { color: #C9C4F5; font-size: 12px; }
.brand-status { color: #D7D3FA; }
.brand-status .dot-live { background: #34D399; box-shadow: 0 0 0 4px rgba(52,211,153,.25); animation: livePulse 2s ease-in-out infinite; }
@keyframes livePulse { 0%,100% { box-shadow: 0 0 0 3px rgba(52,211,153,.30); } 50% { box-shadow: 0 0 0 7px rgba(52,211,153,.05); } }
.flow-badge {
  color: #fff; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.30);
  backdrop-filter: blur(6px); font-weight: 650; padding: 6px 14px; transition: all .16s var(--ease);
}
.flow-badge:hover { background: rgba(255,255,255,.26); transform: translateY(-1px); }

/* Ribbon tabs (sit on the gradient, active tab "merges" into the panel) */
.ribbon-tabs { gap: 4px; }
.ribbon-tab {
  color: #CFCAF8; font-weight: 600; padding: 9px 16px; border-radius: 12px 12px 0 0; border-bottom: none;
  background: transparent; box-shadow: none; transform: none;
}
.ribbon-tab:hover { color: #fff; background: rgba(255,255,255,.14); transform: none; box-shadow: none; }
.ribbon-tab.active { color: var(--accent-dark); background: #FBFAFF; box-shadow: 0 -4px 14px rgba(0,0,0,.12); }
.ribbon-tab.active:hover { color: var(--accent-dark); background: #FBFAFF; }
.ribbon-tab.demo-tab.active, .ribbon-tab.demo-tab:hover { color: #B45309; background: #FFF4DE; border-bottom: none; }
.ribbon-tab.demo-tab:not(.active):hover { color: #FFE2A8; background: rgba(245,158,11,.22); }

.ribbon-panel {
  background: #FBFAFF; border: none; border-radius: 0 14px 0 0; padding: 10px 12px; margin-bottom: 0;
  box-shadow: 0 -1px 0 rgba(255,255,255,.5) inset;
}
.topbar { padding-bottom: 0; }
.ribbon-panel { margin: 0 0 0 0; border-radius: 0 14px 0 0; }
.ribbon-subtabs { border-bottom: 1px dashed var(--border); }
.ribbon-subtab { color: var(--muted); font-weight: 600; background: transparent; border-color: transparent; box-shadow: none; }
.ribbon-subtab:hover { background: var(--accent-soft); color: var(--accent-dark); transform: none; box-shadow: none; }
.ribbon-subtab.active { background: var(--grad-accent); color: #fff; border-color: transparent; box-shadow: 0 3px 10px rgba(109,93,246,.35); }

.tool-group {
  background: #fff; border: 1px solid var(--border); border-radius: var(--radius-md);
  box-shadow: 0 1px 2px rgba(34,28,107,.05); padding: 4px calc(var(--tb-pad-x) + 2px);
}
.tool-label { color: #8C89B3; font-weight: 700; letter-spacing: .06em; }
.zoom-readout { color: var(--accent-dark); }

.help-strip { background: linear-gradient(90deg, #FFF3D6, #FFF9EB); border-bottom: 1px solid #F3D88F; color: #7A5200; padding: 9px 22px; font-weight: 500; }

/* Canvas */
.viewport {
  background:
    radial-gradient(circle at 1px 1px, rgba(109,93,246,.18) 1.1px, transparent 1.4px) 0 0 / 26px 26px,
    linear-gradient(180deg, #F7F6FF 0%, #EEEBFB 100%);
}
.edit-overlay { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-ring), var(--shadow-2); }

/* Side panels / cards */
.panel-card { border-radius: var(--radius-lg); border-color: var(--border); background: #fff; box-shadow: var(--shadow-1); transition: box-shadow .2s var(--ease); }
.panel-card:hover { box-shadow: var(--shadow-2); }
.panel-title, .strategic-section-title { color: var(--accent-dark); letter-spacing: .08em; font-weight: 800; }
.panel-btn { border-radius: var(--radius-sm); }
.panel-btn:hover { background: var(--accent-soft); border-color: #BDB5F7; color: var(--accent-dark); }
.panel-btn.danger:hover { background: var(--danger-soft); color: var(--danger); }
.panel-meta { border-top-color: var(--border); }
.status-chip { box-shadow: 0 2px 6px rgba(0,0,0,.15); padding: 3px 10px; }
.palette-swatch { border-radius: 8px; transition: transform .12s var(--ease); }
.palette-swatch:hover { transform: scale(1.18); }
.palette-swatch.selected { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-ring); }

.selection-bar {
  background: rgba(255,255,255,.92); backdrop-filter: blur(10px); border: 1px solid var(--border);
  box-shadow: 0 12px 34px rgba(34,28,107,.25);
}

/* =====================================================================
   MODALS
   ===================================================================== */
.modal-backdrop, .exec-modal-backdrop {
  background: rgba(20,18,58,.55); backdrop-filter: blur(5px);
  animation: fadeIn .2s var(--ease);
}
.modal, .exec-modal {
  border-radius: 20px; border: 1px solid rgba(255,255,255,.6);
  box-shadow: var(--shadow-3); background: #fff; position: relative;
  animation: popIn .26s var(--ease);
}
.modal::before {
  content: ""; position: sticky; top: -20px; display: block; height: 4px; margin: -20px -20px 16px;
  background: var(--grad-brand); border-radius: 20px 20px 0 0; z-index: 2;
}
.modal-title { font-size: 17px; font-weight: 800; letter-spacing: -.02em; color: var(--text); }
.modal-step { color: var(--muted); }
.modal label { color: var(--text-soft); }
.modal-actions .panel-btn { background: var(--grad-accent); border-color: transparent; color: #fff; font-weight: 650; box-shadow: 0 4px 12px rgba(109,93,246,.35); }
.modal-actions .panel-btn:hover { filter: brightness(1.08); color: #fff; background: var(--grad-accent); }
.exec-modal-head { background: linear-gradient(90deg, var(--accent-soft), #fff); border-bottom: 1px solid var(--border); font-weight: 700; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes popIn { from { opacity: 0; transform: translateY(14px) scale(.97); } to { opacity: 1; transform: none; } }
@keyframes riseIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

.jira-tabs { background: #E8E5FB; border-radius: 14px; padding: 4px; }
.jira-tabs button { border-radius: 10px; color: var(--text-soft); }
.jira-tabs button.active { background: #fff; color: var(--accent-dark); box-shadow: 0 2px 8px rgba(34,28,107,.14); transform: none; }
.jira-tabs button:hover:not(:disabled):not(.active) { transform: none; box-shadow: none; }
.jira-status-line { border-radius: 10px; font-weight: 500; }
.jira-fetch-btn { background: var(--grad-brand); box-shadow: 0 8px 22px rgba(168,85,247,.42); border-radius: 14px; transition: transform .16s var(--ease), box-shadow .16s var(--ease), filter .16s; }
.jira-fetch-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(168,85,247,.5); filter: brightness(1.06); }

/* =====================================================================
   METRICS / REPORTS PAGE
   ===================================================================== */
.metrics-page { background: radial-gradient(900px 500px at 100% 0%, rgba(168,85,247,.10), transparent 60%), var(--bg); animation: fadeIn .2s var(--ease); }
.metrics-topbar {
  background: var(--grad-hero); border-bottom: none; box-shadow: 0 6px 22px rgba(34,28,107,.28); padding: 12px clamp(14px, 1.6vw, 26px);
  position: relative;
}
.metrics-topbar::before { content: ""; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(420px 160px at 20% 0%, rgba(236,72,153,.25), transparent 70%); }
.metrics-topbar > * { position: relative; }
.metrics-topbar-title { color: #fff; font-size: 17px; }
.metrics-topbar-sub { color: #C9C4F5; }
.metrics-topbar .brand-mark { width: 34px; height: 34px; }
.metrics-back-btn { color: #fff; background: rgba(255,255,255,.13); border: 1px solid rgba(255,255,255,.28); backdrop-filter: blur(6px); }
.metrics-back-btn:hover { background: rgba(255,255,255,.26); color: #fff; border-color: rgba(255,255,255,.45); }

.metrics-sidebar {
  width: 236px; background: linear-gradient(180deg, #1B1650 0%, #15123F 60%, #100E33 100%);
  border-right: none; padding: 14px 10px; box-shadow: 4px 0 24px rgba(34,28,107,.18);
  scrollbar-color: #4A42A0 transparent;
}
.metrics-sidebar::-webkit-scrollbar-thumb { background: #4A42A0; background-clip: content-box; }
.metrics-nav-item {
  color: #BDB8EE; font-weight: 550; padding: 9px 12px; border-radius: 10px; margin-bottom: 3px; background: transparent;
  box-shadow: none; position: relative; transform: none; border: none;
}
.metrics-nav-item:hover { background: rgba(255,255,255,.09); color: #fff; transform: translateX(2px); box-shadow: none; }
.metrics-nav-item.active { background: linear-gradient(90deg, rgba(109,93,246,.95), rgba(168,85,247,.80)); color: #fff; box-shadow: 0 6px 16px rgba(109,93,246,.45); }
.metrics-nav-item.active::before { content: ""; position: absolute; left: -10px; top: 20%; bottom: 20%; width: 4px; border-radius: 0 4px 4px 0; background: #F472B6; }
.metrics-nav-item .nav-badge { color: #fff; background: linear-gradient(135deg, #EC4899, #F59E0B); }
.metrics-nav-item .nav-caret { color: #8F89D6; }
.metrics-nav-item.child { font-weight: 500; }

.metrics-content { padding: clamp(16px, 1.8vw, 30px); }
.metrics-content > * { animation: riseIn .35s var(--ease) both; }
.metrics-content-title {
  font-size: 22px; font-weight: 800; letter-spacing: -.025em;
  background: linear-gradient(90deg, #17153A, #4B3BD6 70%, #A855F7); -webkit-background-clip: text; background-clip: text; color: transparent;
}
.metrics-content-sub { font-size: 13px; }
.metrics-empty { border: 2px dashed #CFCAF5; background: linear-gradient(180deg, #fff, #F7F5FF); border-radius: 20px; }
.metrics-note { background: linear-gradient(90deg, #EFEDFF, #F8F1FF); border: 1px solid #D5CFFA; border-left: 4px solid var(--accent); }

/* ---- KPI cards: colourful top accents, cycling palette ---- */
.kpi-card, .exec-kpi {
  --k: var(--accent); position: relative; overflow: hidden; border-radius: var(--radius-md); border: 1px solid var(--border);
  background: linear-gradient(180deg, #fff 0%, color-mix(in srgb, var(--k) 7%, #fff) 100%);
  box-shadow: var(--shadow-1); transition: transform .18s var(--ease), box-shadow .18s var(--ease), border-color .18s;
}
.kpi-card::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 4px; background: linear-gradient(90deg, var(--k), color-mix(in srgb, var(--k) 55%, #fff)); }
.kpi-card::after { content: ""; position: absolute; right: -26px; top: -26px; width: 84px; height: 84px; border-radius: 50%; background: color-mix(in srgb, var(--k) 12%, transparent); pointer-events: none; }
.kpi-row > :nth-child(6n+2), .sh-kpi-5 > :nth-child(6n+2) { --k: var(--accent-5); }
.kpi-row > :nth-child(6n+3), .sh-kpi-5 > :nth-child(6n+3) { --k: var(--accent-3); }
.kpi-row > :nth-child(6n+4), .sh-kpi-5 > :nth-child(6n+4) { --k: var(--accent-4); }
.kpi-row > :nth-child(6n+5), .sh-kpi-5 > :nth-child(6n+5) { --k: var(--accent-2); }
.kpi-row > :nth-child(6n+6), .sh-kpi-5 > :nth-child(6n+6) { --k: #8B5CF6; }
.kpi-card:hover, .kpi-clickable:hover, .exec-kpi:hover { transform: translateY(-3px); box-shadow: 0 12px 28px color-mix(in srgb, var(--k) 25%, transparent); border-color: color-mix(in srgb, var(--k) 45%, #fff); }
.kpi-card .kpi-label { font-weight: 700; letter-spacing: .06em; color: var(--muted); }
.kpi-card .kpi-value { font-size: 26px; font-weight: 800; letter-spacing: -.03em; color: var(--text); }
.kpi-card .kpi-value.accent { color: color-mix(in srgb, var(--k) 78%, #000); }
.kpi-card .kpi-value.good { color: #0E9347; }
.kpi-card .kpi-value.warn { color: #D97706; }
.kpi-clickable.active { border-color: var(--k); box-shadow: 0 0 0 3px color-mix(in srgb, var(--k) 25%, transparent); }

/* ---- Tiles, cards and panels (shared) ---- */
.subtrack-tile, .strategic-tile, .report-hub-card, .story-type-tile, .vel-sub-tile, .pie-chart-card, .lt-parent,
.exec-due-card, .exec-panel, .pg-card, .strategic-expand, .exec-toolbar, .sh-program, .scope-group-toggle {
  border-radius: var(--radius-lg); border-color: var(--border); box-shadow: var(--shadow-1);
  transition: transform .18s var(--ease), box-shadow .18s var(--ease), border-color .18s var(--ease);
}
.subtrack-tile, .strategic-tile, .report-hub-card, .story-type-tile, .vel-sub-tile, .pie-chart-card, .lt-parent { position: relative; overflow: hidden; }
.subtrack-tile::before, .strategic-tile::before, .report-hub-card::before, .story-type-tile::before, .pie-chart-card::before, .lt-parent::before {
  content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--grad-brand); opacity: .9;
}
.subtrack-tile:hover, .strategic-tile:hover, .report-hub-card:hover, .story-type-tile:hover, .lt-click:hover {
  transform: translateY(-3px); box-shadow: 0 14px 32px rgba(109,93,246,.18); border-color: #BDB5F7;
}
.report-hub-card .rh-icon { width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; border-radius: 12px; background: var(--grad-accent); color: #fff; box-shadow: 0 6px 14px rgba(109,93,246,.35); font-size: 20px; }
.report-hub-card:nth-child(4n+2) .rh-icon { background: linear-gradient(135deg, #0EA5E9, #06B6D4); box-shadow: 0 6px 14px rgba(14,165,233,.35); }
.report-hub-card:nth-child(4n+3) .rh-icon { background: linear-gradient(135deg, #14B8A6, #22C55E); box-shadow: 0 6px 14px rgba(20,184,166,.35); }
.report-hub-card:nth-child(4n+4) .rh-icon { background: linear-gradient(135deg, #F59E0B, #EC4899); box-shadow: 0 6px 14px rgba(245,158,11,.35); }
.report-hub-card .rh-title { font-size: 14px; font-weight: 750; }
.report-hub-card .rh-stat, .subtrack-tile-capacity, .strategic-tile-stat-value, .strategic-tile-total b, .lt-parent-total b, .sh-days b, .vel-sub-pct, .sh-days-big b, .sh-scope-big b {
  background: var(--grad-brand); -webkit-background-clip: text; background-clip: text; color: transparent; letter-spacing: -.03em;
}
.subtrack-stat, .strategic-tile-stat, .dep-detail-field, .risk-grid div, .aging-grid button { background: linear-gradient(180deg, #F7F6FF, #F1EFFE); border: 1px solid var(--border-soft); border-radius: 10px; }
.subtrack-progress-bar, .vel-sub-bar, .demo-progress-track { background: #E7E4FA; height: 8px; border-radius: 999px; }
.subtrack-progress-fill { background: linear-gradient(90deg, #6D5DF6, #A855F7, #EC4899); border-radius: 999px; box-shadow: 0 0 10px rgba(168,85,247,.45); transition: width .6s var(--ease); }
.vel-sub-bar-fill { background: linear-gradient(90deg, #14B8A6, #22C55E); border-radius: 999px; }
.exec-bar { background: linear-gradient(180deg, #A855F7, #6D5DF6); border-radius: 6px 6px 0 0; }
.strategic-status-cell { border-radius: 10px; background: #fff; border: 1px solid var(--border-soft); border-top-width: 4px; box-shadow: var(--shadow-1); }
.strategic-status-cell.todo { border-top-color: #9CA3C7; }
.strategic-status-cell.ready { border-top-color: #0EA5E9; }
.strategic-status-cell.prog { border-top-color: #6D5DF6; }
.strategic-status-cell.done { border-top-color: #12A150; }
.strategic-status-cell.cancel { border-top-color: #DC3A4A; }
.strategic-person-chip, .mini-chip { background: #F1EFFE; border: 1px solid #DAD5FA; color: var(--accent-dark); border-radius: 999px; }
.chip-btn { border-radius: 999px; background: #fff; border-color: var(--border); font-weight: 600; }
.chip-btn:hover:not(.active) { background: var(--accent-soft); border-color: #BDB5F7; }
.chip-btn.active { background: var(--grad-accent); border-color: transparent; box-shadow: 0 4px 10px rgba(109,93,246,.35); }
.sh-big { border: none; background: var(--grad-hero); color: #fff; box-shadow: 0 18px 40px rgba(43,32,144,.35); }
.sh-big::before { display: none; }
.sh-big .strategic-tile-name, .sh-big .sprint-progress-label, .sh-big .sh-days span { color: #D9D5FB; }
.sh-big .sh-days b { background: linear-gradient(90deg, #fff, #F9A8D4); -webkit-background-clip: text; background-clip: text; color: transparent; }
.sh-program { background: linear-gradient(180deg, #fff, #F7F5FF); }
.sprint-state { background: linear-gradient(135deg, #6D5DF6, #A855F7); color: #fff; }
.sprint-health-badge.good { background: var(--success-soft); color: #0B7A3B; }
.sprint-health-badge.warn { background: #FFF1CF; color: #A15C00; }
.sprint-health-badge.bad { background: var(--danger-soft); color: #B3202F; }
.plan-group-head, .lt-group-row td, .scope-group-count { background: linear-gradient(90deg, #ECE8FF, #F6EEFF); color: var(--accent-dark); }
.scope-group-heading { font-size: 15px; }
.jira-chart-box { background: #fff; border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 14px; box-shadow: var(--shadow-1); }
.pg-chip.warn { background: #FFF3D6; border-color: #F5CB6A; color: #8A5A00; }
.pg-chip.ok { background: #DDF6E8; border-color: #6FD3A0; color: #0B6B35; }
.pg-chip.bad { background: #FDE3E6; border-color: #F0A3AC; color: #A3202F; }
.pg-chip.info { background: #E1F1FD; border-color: #8CCBF3; color: #0B5F94; }
.pg-cell, .dep-matrix-cell { background: #ECE8FF; color: var(--accent-dark); border-radius: 8px; transition: all .14s var(--ease); }
.pg-cell:hover, .dep-matrix-cell:hover:not(.zero) { background: var(--grad-accent); color: #fff; transform: scale(1.08); }
.dep-matrix-cell.active { background: var(--grad-accent); }
.dep-matrix-cell.zero:hover { background: transparent; transform: none; color: #C7CCD4; }
.dep-matrix-axis-btn.active { background: var(--grad-accent); }
.count-link, .dep-issue-link { color: var(--accent-dark); text-decoration-color: rgba(109,93,246,.4); text-underline-offset: 3px; }
.info-bang { border-color: var(--accent); background: #fff; }
.info-bang:hover { background: var(--accent); }

/* ---- Tables ---- */
table { border-collapse: separate; border-spacing: 0; }
.jira-table, .strategic-sub-table, .pg-table { background: #fff; }
.jira-table th, .strategic-sub-table th, .pg-table th, .dependency-table th {
  background: linear-gradient(180deg, #F4F2FF, #ECE9FD); color: var(--accent-dark); font-weight: 750; letter-spacing: .04em;
  border-bottom: 1px solid #D8D3F7; position: sticky; top: 0; z-index: 1;
}
.jira-table th:first-child, .strategic-sub-table th:first-child, .pg-table th:first-child { border-top-left-radius: 10px; }
.jira-table th:last-child, .strategic-sub-table th:last-child, .pg-table th:last-child { border-top-right-radius: 10px; }
.jira-table td, .strategic-sub-table td, .pg-table td { border-bottom: 1px solid var(--border-soft); transition: background .12s; }
.jira-table tbody tr:nth-child(even) td, .strategic-sub-table tbody tr:nth-child(even) td { background: #FBFAFF; }
.jira-table tbody tr:hover td, .strategic-sub-table tbody tr:hover td, .pg-table tbody tr:hover td { background: #F1EEFF; }
.dependency-table-wrap { border-radius: 14px; border-color: var(--border); box-shadow: var(--shadow-1); }
.exec-list button:hover, .exec-due-list button:hover { background: #F4F1FF; }

/* ---- Gantt ---- */
.gantt-box { border-radius: var(--radius-lg); box-shadow: var(--shadow-2); border: 1px solid var(--border); }
.gantt-toolbar { background: linear-gradient(180deg, #F7F5FF, #EFEBFF); border-bottom: 1px solid var(--border); }
.gantt-tool-btn { border-radius: 8px; }
.gantt-left-header, .gantt-ruler { background: #F1EEFF; }
.gantt-left-header-spacer { background: #E8E4FD; }
.gantt-ruler-month { background: linear-gradient(180deg, #E8E4FD, #DFD9FB); color: var(--accent-dark); }
.gantt-ruler-day.today { background: linear-gradient(180deg, #6D5DF6, #8B5CF6); color: #fff; }
.gantt-ruler-day.weekend { background: #F4F2FC; }
.gantt-left-row.odd, .gantt-right-row.odd { background: #FBFAFF; }
.gantt-left-row:hover { background: #F1EEFF; }
.gantt-today-line { border-left: 2px dashed #EC4899; }
.gantt-bar { border-radius: 6px; box-shadow: 0 2px 6px rgba(34,28,107,.20); }
.gantt-columns-pop { border-radius: 14px; box-shadow: var(--shadow-3); }
.gantt-status-pill, .gantt-type-badge { box-shadow: 0 1px 2px rgba(0,0,0,.06); }

/* ---- Workflow dark view ---- */
.wf-stage { background: radial-gradient(900px 500px at 50% 0%, #1B1A5E, #070C22 70%); border-radius: 14px; }
.wf-svg { background: #0A1030; box-shadow: 0 20px 50px rgba(0,0,0,.4); }
.wf-toolbar button { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.2); color: #E7E4FF; }
.wf-toolbar button:hover:not(:disabled) { background: rgba(255,255,255,.18); transform: none; color: #fff; }

/* ---- Misc ---- */
.tab-refresh-btn { border-radius: 999px; background: #fff; color: var(--accent-dark); border-color: #D5CFFA; padding: 5px 13px; transition: all .16s var(--ease); }
.tab-refresh-btn:hover:not(:disabled) { background: var(--accent-soft); color: var(--accent-dark); transform: translateY(-1px); }
.comment-item { border-radius: 12px; background: #FBFAFF; border-color: var(--border-soft); }
.demo-progress-fill { background: linear-gradient(90deg, #F59E0B, #EC4899); }
.legend-row { color: var(--text-soft); }

/* ---- Responsive polish ---- */
@media (max-width: 900px) {
  .metrics-body { flex-direction: column; }
  .metrics-sidebar { width: 100%; max-height: 150px; padding: 8px; display: flex; flex-wrap: wrap; gap: 4px; }
  .metrics-nav-item { width: auto; }
  .metrics-nav-item.active::before { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
}

  /* Sprint Jira Hygiene: report tiles, exception emphasis, and wide issue register modal. */
  .hygiene-context { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; padding:10px 14px; margin-bottom:14px; border:1px solid #DCD8FA; border-radius:12px; background:linear-gradient(100deg,#F6F4FF,#F0FAFF); color:var(--text-soft); font-size:11.5px; }
  .hygiene-context b { color:var(--accent-dark); font-size:13px; }
  .hygiene-context span { color:var(--muted); text-transform:capitalize; }
  .hygiene-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px; margin:8px 0 18px; }
  .hygiene-grid-late { grid-template-columns:minmax(250px,360px); }
  .hygiene-card { min-height:158px; display:flex; flex-direction:column; align-items:flex-start; gap:5px; padding:14px 16px; border:1px solid var(--border); border-radius:14px; background:linear-gradient(150deg,#fff,#F8F7FF); box-shadow:var(--shadow-1); text-align:left; white-space:normal; }

  .hygiene-danger { background:linear-gradient(145deg,#fff,#FFF1F2); border-color:#F0C8CE; }

  /* Program health progress moved into its own clickable detail tile and modal. */
  .sh-program-overall { margin-top:8px; }
  .sh-progress-summary-tile { display:block; width:100%; margin:0 0 14px; padding:13px 16px; border:1px solid #DCD8FA; border-radius:13px; background:linear-gradient(110deg,#F8F7FF,#F3FBFF); text-align:left; white-space:normal; box-shadow:var(--shadow-1); }

  .velocity-controls { display:flex; align-items:center; gap:8px; flex-shrink:0; }

  .velocity-summary-card { position:relative; overflow:hidden; min-height:106px; padding:14px 16px; border:1px solid var(--border); border-radius:13px; background:linear-gradient(145deg,#fff,#F8F7FF); box-shadow:var(--shadow-1); }

  .velocity-legend-completed { background:#20A878; }
  .velocity-track-section { margin-top:8px; }

  .vel-history-tile { min-width:0; padding:13px 14px 11px; border:1px solid var(--border); border-radius:13px; background:linear-gradient(150deg,#fff,#F9F8FF); box-shadow:var(--shadow-1); }

function wsStatusKey(i) {

function wsStatusSplitModel(id, title, subtitle, list, opts) {

      type = withType ? goalsTypeLabel(i.type) : "";

  GOALS_TILES.forEach(t => {
    const list = (t.allTypes ? prog.items : prog.stories).filter(i => t.match(wsStatusKey(i)));
